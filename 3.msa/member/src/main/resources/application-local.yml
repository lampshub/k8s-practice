server:
#  port번호가 0번일 경우, 0~65535 중에 현재 host에서 사용하지 않는 port 임의로 설정
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/  #유레카 주소 설정

spring:
  config:
    activate:
      on-profile: local
  application:
    name: member-service
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/ordermsa
    username: root
    password: test1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true
  redis:  #rt 저장
    host: localhost
    port: 6379

jwt:
  expiration: 30   #유효시간 30분. 자유롭게 설정 가능.
  #  인코딩된 문자 32자 이상 필요.(특수문자) : base64 encoder 웹사이트 활용
  #  beyondaccesstokensecretkeybeyondaccesstokensecretkeybeyondaccesstokensecretkey
  secretKey: YmV5b25kYWNjZXNzdG9rZW5zZWNyZXRrZXliZXlvbmRhY2Nlc3N0b2tlbnNlY3JldGtleWJleW9uZGFjY2Vzc3Rva2Vuc2VjcmV0a2V5
  expirationRt: 30000
  secretKeyRt: YmV5b25kYWNjZXNzdG9rZW5zZWNyZXRrZXliZXlvbmRhY2Nlc3N0b2tlbnNlY3JldGtleWJleW9uZGFjY2Vzc3Rva2Vuc2VjcmV0a2V5

#  logback의 로그레벨 : trace < debug < info < error 순서
logging:
  level:
    root: info
