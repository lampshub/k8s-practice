server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/  #유레카 주소 설정

spring:
  application:
    name: product-service
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/ordermsa
    username: root
    password: test1234
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true
  redis:  #rt 저장
    host: localhost
    port: 6379
  kafka:
    kafka-server: localhost:9092
    consumer:
#      카프카에서 그룹id는 컨슈머 그룹을 식별하는 ID로서, 동일한 그룹ID를 가진 컨슈머들은 메세지를 분담해서 consume
      group-id: product-group

#aws s3 접근하기위한 계정세팅
aws:
  credentials:    #유출되면 안됨!!!  --- 사용안할때는 aws에서 비활성화해두는게 좋음
    access-key: xxxx
    secret-key: yyyyy
  region: ap-northeast-2  #aws전세계 센터위치(아시아태평양(서울))
  s3:
    bucket1: lamps-board-profile-image    #용도에 따라 다른버킷을 사용할때 bucket2 같은 식으로 추가해서 사용할수도 있음
